[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoagent"
version = "2.0.0a1"
description = "AutoAgent V2 Workflow Core"
readme = {text = "AutoAgent V2 Workflow Core: workflow compilation, execution, recovery, and external event sink interfaces.", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "typing-extensions>=4.12",
]

[project.scripts]
autoagent = "autoagent.cli.main:main"

[project.optional-dependencies]
evaluation = [
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "aiosqlite>=0.22,<1",
  "asyncpg>=0.31,<1",
  "python-dotenv>=1.1,<2",
]
cli = [
  "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "aiosqlite>=0.22,<1",
  "asyncpg>=0.31,<1",
  "python-dotenv>=1.1,<2",
]
skills = [
  "PyYAML>=6,<7",
]
agent = [
  "PyYAML>=6,<7",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-bash>=0.25,<0.26",
  "tree-sitter-powershell>=0.26,<0.27",
  "pathspec>=0.12.1,<1",
  "regex>=2024.11.6",
  "jsonschema>=4.23,<5",
  "openai>=2.53,<3",
]
litellm = [
  "jsonschema>=4.23,<5",
  "openai>=2.53,<3",
  "litellm>=1.105.1,<2",
]
mcp = [
  "mcp>=2.3,<3",
  "jsonschema>=4.20,<5",
  "referencing>=0.31,<1",
]
server = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "aiosqlite>=0.22,<1",
  "asyncpg>=0.31,<1",
  "python-dotenv>=1.1,<2",
]
host = [
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "aiosqlite>=0.22,<1",
  "asyncpg>=0.31,<1",
  "python-dotenv>=1.1,<2",
]
persistence = [
  "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "aiosqlite>=0.22,<1",
  "asyncpg>=0.31,<1",
]

[tool.setuptools.packages.find]
include = ["autoagent", "autoagent.core", "autoagent.core.*", "autoagent.agent", "autoagent.agent.*", "autoagent.agent_app", "autoagent.agent_app.*", "autoagent.host", "autoagent.host.*", "autoagent.server", "autoagent.cli", "autoagent.cli.*", "autoagent.evaluation", "autoagent.evaluation.*"]

[tool.setuptools.package-data]
"autoagent" = ["py.typed"]
"autoagent.server" = ["static/index.html", "static/assets/*"]
