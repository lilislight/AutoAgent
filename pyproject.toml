[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoagent"
version = "2.0.0a1"
description = "AutoAgent V2 Workflow Core"
readme = {text = "AutoAgent V2 Workflow Core: workflow compilation, execution, recovery, and external event sink interfaces.", content-type = "text/markdown"}
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "typing-extensions>=4.12",
]

[tool.setuptools.packages.find]
include = ["autoagent", "autoagent.core", "autoagent.core.*"]

[tool.setuptools.package-data]
"autoagent" = ["py.typed"]
