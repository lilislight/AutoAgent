<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e0e0e0" />
    <script>
      (() => {
        let theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        try {
          const saved = localStorage.getItem("autoagent:theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#141414' : '#e0e0e0');
      })();
    </script>
    <!--AUTOAGENT_CONFIG-->
    <meta name="apple-mobile-web-app-title" content="AutoAgent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./assets/agent.webmanifest" />
    <link rel="apple-touch-icon" href="./assets/agent-icon-180.png" />
    <link rel="icon" type="image/svg+xml" href="/src/autoagent.svg" />
    <link rel="stylesheet" href="/src/loading.css" />
    <title>AutoAgent Tracing</title>
  </head>
  <body>
    <div id="root"><div class="app-boot-loading" role="status" aria-label="Loading AutoAgent"><span class="loading-spinner" aria-hidden="true"></span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
