[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "autoagent-core-v2"
version = "0.1.0"
description = "Standalone AutoAgent V2 Workflow Core"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "typing-extensions>=4.12",
]

[tool.setuptools.packages.find]
include = ["autoagent*"]
